name: Validate Merge to Dev

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"

          if [[ "${{ github.base_ref }}" == "dev" ]]; then
            if [[ "${{ github.head_ref }}" =~ ^feat\/.* ]]; then
              echo "✅ Valid feature branch. Merge allowed."
            else
              echo "❌ Only branches starting with 'feat/' can merge into dev."
              exit 1
            fi
          fi
