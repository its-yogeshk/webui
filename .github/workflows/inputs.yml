name: Inputs actions
on:
  workflow_dispatch:
    inputs:
      environment: 
        description: 'Select Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
      version:
        description: 'App Version'
        deafult: '0.0.1'
        type: string

jobs:
  inputs_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4


